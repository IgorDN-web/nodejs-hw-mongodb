tags: [Auth]
summary: Логін
operationId: login
description: Повертає pair токенів
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email, password]
        properties:
          email: { type: string, format: email }
          password: { type: string, minLength: 6 }
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
  '401':
    $ref: ../../components/responses.yaml#/Unauthorized
