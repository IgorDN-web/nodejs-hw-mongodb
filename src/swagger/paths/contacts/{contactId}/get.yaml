tags: [Contacts]
summary: Отримати контакт за ID
operationId: getContactById
description: Повертає контакт за його унікальним ідентифікатором
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Унікальний ідентифікатор контакту
    schema:
      type: string
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          $ref: ../../components/schemas.yaml#/Contact
  '401':
    $ref: ../../components/responses.yaml#/Unauthorized
  '404':
    $ref: ../../components/responses.yaml#/NotFound
