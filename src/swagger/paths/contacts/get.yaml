tags: [Contacts]
summary: Отримати список контактів
operationId: getContacts
description: Повертає список контактів з пагінацією, сортуванням та фільтрами.
security:
  - bearerAuth: []
parameters:
  - $ref: ../../components/parameters/paginationPage.yaml
  - $ref: ../../components/parameters/paginationLimit.yaml
  - $ref: ../../components/parameters/sortBy.yaml
  - $ref: ../../components/parameters/sortOrder.yaml
  - $ref: ../../components/parameters/favorite.yaml
  - name: type
    in: query
    description: Фільтрація за типом контакту
    required: false
    schema:
      type: string
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          $ref: ../../components/schemas.yaml#/ContactsList
  '401':
    $ref: ../../components/responses.yaml#/Unauthorized
