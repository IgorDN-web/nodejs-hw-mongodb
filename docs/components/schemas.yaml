schemas:
  Contact:
    type: object
    properties:
      _id:
        type: string
        example: '64d1f8a2c2f1b23a4f9c1234'
      name:
        type: string
        example: 'John Doe'
      email:
        type: string
        format: email
        example: 'john@example.com'
      phone:
        type: string
        example: '+380501234567'

  ContactsList:
    type: array
    items:
      $ref: '#/schemas/Contact'
