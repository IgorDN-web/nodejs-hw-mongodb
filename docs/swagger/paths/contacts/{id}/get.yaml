get:
  summary: Get contact by ID
  tags:
    - Contacts
  parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      description: Contact ID
  responses:
    '200':
      description: Successfully found contact!
      content:
        application/json:
          schema:
            type: object
            required: [status, message, data]
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact!
              data:
                $ref: ../../../components/schemas.yaml#/schemas/Contact
    '401':
      $ref: ../../../components/responses.yaml#/responses/Unauthorized
    '404':
      description: Contact not found
