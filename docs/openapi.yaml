openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API (hw7-swagger)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    REST API для роботи з контактами (CRUD) + авторизація. Документація зібрана ReDocly, інтерактив — на /api-docs.

tags:
  - name: Contacts
    description: Операції з контактами
  - name: Auth
    description: Авторизація та токени

servers:
  - url: http://localhost:3000
    description: Local
  - url: https://nodejs-hw-mongodb-7-5jsk.onrender.com
    description: Render (hw7-swagger)

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    parameters:
      - $ref: ../swagger/components/parameters/contactId.yaml
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml

  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.post.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.post.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh.post.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.post.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    $ref: ../swagger/components/schemas.yaml

  responses:
    $ref: ../swagger/components/responses.yaml

  parameters:
    contactId:
      $ref: ../swagger/components/parameters/contactId.yaml
    paginationPage:
      $ref: ../swagger/components/parameters/paginationPage.yaml
    paginationLimit:
      $ref: ../swagger/components/parameters/paginationLimit.yaml
    sortBy:
      $ref: ../swagger/components/parameters/sortBy.yaml
    sortOrder:
      $ref: ../swagger/components/parameters/sortOrder.yaml
    favorite:
      $ref: ../swagger/components/parameters/favorite.yaml
